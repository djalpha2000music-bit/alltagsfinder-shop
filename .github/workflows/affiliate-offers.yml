name: Alltagsfinder Partnerangebote gesammelt aktualisieren

on:
  push:
    branches: [main]
    paths:
      - 'data/affiliate-offers.csv'
      - 'tools/build-offers.mjs'
      - '.github/workflows/affiliate-offers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Geprüfte Angebote zusammenstellen
        run: node tools/build-offers.mjs
      - name: Veröffentlichten Datenbestand speichern
        run: |
          if ! git diff --quiet -- partner-offers.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add partner-offers.js
            git commit -m "Update verified affiliate offers from bulk table"
            git push
          else
            echo "No change to published partner offers."
          fi
